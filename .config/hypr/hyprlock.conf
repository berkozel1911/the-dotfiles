# See https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
# Palette: Kanagawa base + Ayu bright, cyan accent

$bg      = rgb(1f1f28)
$surface = rgb(2a2a37)
$fg      = rgb(dcd7ba)
$muted   = rgb(727169)
$accent  = rgb(95e6cb)
$red     = rgb(f28779)
$yellow  = rgb(ffcc66)
$font    = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled   = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
    color       = $bg
}

label {
    monitor     =
    text        = $TIME
    color       = $fg
    font_size   = 96
    font_family = $font
    position    = 0, 160
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = $muted
    font_size   = 18
    font_family = $font
    position    = 0, 70
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 320, 52
    outline_thickness = 2
    rounding          = 8
    dots_size         = 0.25
    dots_spacing      = 0.3

    outer_color = $accent
    inner_color = $surface
    font_color  = $fg
    check_color = $yellow
    fail_color  = $red

    font_family      = $font
    placeholder_text = <span foreground="##727169">password</span>
    fail_text        = $PAMFAIL
    fade_on_empty    = false

    position = 0, -40
    halign   = center
    valign   = center
}
